name: Smoke test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core]"

      - name: Smoke test
        run: python -m voice --smoke-test
